name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The accounting tests run against a real Mongo — a throwaway service DB.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # lint + format:check + the 17-test accounting/permission suite
      - run: npm run check
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/b_ledger_test
