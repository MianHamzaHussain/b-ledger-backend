name: CI

# One check per pull request, plus master after a merge. (Running on every
# `push` as well showed each PR the same check twice.)
on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same PR supersedes an older run of its check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    # The accounting tests run against a real Mongo — a throwaway service DB.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # lint + format:check + the node:test suite
      - run: npm run check
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/b_ledger_test

  # Ship master to the VPS — only after the check above passed on it. Off until
  # the repository variable DEPLOY_ENABLED is `true` (Settings → Variables), so
  # the workflow can merge before the SSH secrets exist. See README → Deploying.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Never two deploys at once; a queued one waits rather than being cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key — a server that doesn't match is refused.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull, install, restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # A non-interactive SSH shell doesn't load nvm; node/npm/pm2 live there.
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use >/dev/null || true

          cd /var/www/sites/b-ledger-backend
          # --ff-only: a server with local edits fails loudly instead of being overwritten.
          git pull --ff-only origin master
          npm ci --omit=dev
          pm2 restart bledger-api

          # Healthy or fail the deploy — a crash on boot shows up here, not in a user report.
          PORT_API=$(grep -E '^PORT=' .env | head -1 | cut -d= -f2 | tr -d ' "' || true)
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:${PORT_API:-5000}/api/v1/health" >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy — check: pm2 logs bledger-api" >&2
          exit 1
          REMOTE
