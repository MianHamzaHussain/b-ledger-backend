# B Ledger's Shopify app — the settings Shopify keeps for it. Deployed by the owner with the Shopify CLI (`shopify app deploy`),
# never by the server. There are NO secrets here: the Client ID is public, and the Client secret stays in the server's .env.
#
# Replace the two https://backend.bledger.org addresses and `client_id` with your own before the first deploy (README →
# "Connect Shopify with one click — the Shopify app"). If you change a path here, change the route in routes/shopify.js too.

name = "B Ledger"
client_id = "PASTE-THE-CLIENT-ID-FROM-THE-DEV-DASHBOARD"

# Shopify sends the browser here when someone presses Install. The app runs on its own site, not inside the Shopify admin.
application_url = "https://backend.bledger.org/api/v1/integrations/shopify/install"
embedded = false

[access_scopes]
# B Ledger only READS orders. It writes nothing to the store.
scopes = "read_orders"
# We run Shopify's authorization-code flow ourselves (the app is not embedded), so Shopify's managed install is off.
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://backend.bledger.org/api/v1/integrations/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

  # An order was placed: B Ledger asks the store what is new.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://backend.bledger.org/api/v1/integrations/shopify/webhooks"

  # The owner removed the app: the connection stops and the business is told.
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://backend.bledger.org/api/v1/integrations/shopify/webhooks"

  # Shopify's privacy requests, which every public app must answer.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://backend.bledger.org/api/v1/integrations/shopify/webhooks"
